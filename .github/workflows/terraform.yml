name: Terraform CI/CD

on:
  push:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, closed]
  pull_request_target:
    branches: [develop, main]
    types: [closed]

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize without remote backend
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        run: terraform validate
      - name: Test with mocked AWS provider
        run: terraform test -no-color
      - name: Test environment configurations with mocked AWS
        run: |
          for deployment_environment in homologacao producao; do
            terraform test -no-color -test-directory=tests/environments \
              -var-file="environments/${deployment_environment}/environment.tfvars.json"
          done

  terraform:
    name: Terraform deploy
    needs: validate
    # Open fork PRs run validation only. After merge, pull_request_target runs
    # from the base repository context so environment secrets can be used.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.event.action != 'closed' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ github.event.pull_request.base.ref == 'main' && 'producao' || 'homologacao' }}
    concurrency:
      group: terraform-${{ github.event.pull_request.base.ref == 'main' && 'producao' || 'homologacao' }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ github.event.pull_request.base.ref == 'main' && 'producao' || 'homologacao' }}
      TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
      DEPLOY_SHA: ${{ github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      EXPECTED_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: Check environment configuration
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          if [[ ! "$EXPECTED_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::Configure AWS_ACCOUNT_ID with 12 digits in this GitHub environment."
            exit 1
          fi
          if [[ -z "$TF_STATE_BUCKET" ]]; then
            echo "::error::Configure TF_STATE_BUCKET in this GitHub environment."
            exit 1
          fi
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
              echo "::error::Configure AWS_ROLE_ARN for OIDC or AWS credential secrets in this environment."
              exit 1
            fi
            if [[ "$AWS_ACCESS_KEY_ID" == ASIA* && -z "$AWS_SESSION_TOKEN" ]]; then
              echo "::error::Temporary AWS credentials require AWS_SESSION_TOKEN from the same session."
              exit 1
            fi
          fi
      - name: Authenticate AWS with OIDC
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: tc3-09-${{ github.run_id }}
          allowed-account-ids: ${{ env.EXPECTED_ACCOUNT_ID }}
          unset-current-credentials: true
      - name: Authenticate AWS with environment secrets
        if: vars.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          allowed-account-ids: ${{ env.EXPECTED_ACCOUNT_ID }}
          unset-current-credentials: true
      - name: Verify AWS identity
        run: |
          actual_account_id=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$actual_account_id" != "$EXPECTED_ACCOUNT_ID" ]]; then
            echo "::error::Authenticated AWS account differs from AWS_ACCOUNT_ID."
            exit 1
          fi
      - name: Initialize environment remote state
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="environments/${DEPLOY_ENV}/backend.hcl" \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="allowed_account_ids=[\"${EXPECTED_ACCOUNT_ID}\"]"
      - name: Validate environment configuration
        run: terraform validate -no-color
      - name: Terraform plan
        run: |
          terraform plan -no-color -input=false -lock-timeout=5m \
            -var-file="environments/${DEPLOY_ENV}/environment.tfvars.json" \
            -out=deployment.tfplan
      - name: Terraform apply after merge
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" --jq '.object.sha')
          if [[ "$current_sha" != "$DEPLOY_SHA" ]]; then
            echo "::error::The branch has a newer revision; only the latest merged revision may deploy."
            exit 1
          fi
          terraform apply -no-color -input=false -lock-timeout=5m deployment.tfplan
